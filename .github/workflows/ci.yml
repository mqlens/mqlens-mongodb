name: CI

# Run the test suites on every PR into dev or main so nothing merges red.
on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `tauri build` refuses to start when a Tauri crate and its npm package are on
  # different major.minor releases, but only the Release workflow runs it. Check
  # the same pairing on every PR, so a one-sided dependency bump fails here
  # instead of failing every platform build of the next release (#382, #387).
  tauri-versions:
    name: tauri versions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Tauri crate/npm version check
        run: npm run check:tauri-versions

  frontend:
    name: frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: i18n catalog check
        run: npm run i18n:check
      - name: Type-check & build
        run: npm run build
      - name: Unit tests with coverage
        run: npm run coverage:frontend
      - name: Frontend coverage summary
        run: |
          node <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('coverage/frontend/coverage-summary.json', 'utf8')).total;
          const rows = ['lines', 'statements', 'functions', 'branches']
            .map((key) => `| ${key} | ${summary[key].pct}% | ${summary[key].covered}/${summary[key].total} |`)
            .join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Frontend coverage\n\n| Metric | Coverage | Covered |\n|---|---:|---:|\n${rows}\n`);
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: coverage/frontend

  backend:
    name: backend
    runs-on: ubuntu-22.04
    # A real MongoDB so the integration tests can exercise the live query/aggregate/
    # DDL/document/export/GridFS/schema paths (the bulk of the backend). Without it
    # those tests no-op and coverage drops well below the gate below.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests read this; when unset they skip (keeps `cargo test` green offline).
      MQLENS_TEST_MONGO_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Tauri lib + gssapi-auth feature need these system libs to compile.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libkrb5-dev \
            clang \
            libclang-dev \
            build-essential
      # Pinned to the head of the action's `stable` branch. That branch name was
      # never magic: the action reads `inputs.toolchain`, whose default differs
      # per branch, and never looks at the ref it was called by — so the
      # toolchain is stated here instead of being implied by the ref.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      # Same shape: the `cargo-llvm-cov` tag only sets `inputs.tool`'s default.
      - uses: taiki-e/install-action@94a99045a72830168b8eae8bf767ba08abeca856 # cargo-llvm-cov tag
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      # The real MONGODB-OIDC handshake test (#430) needs Percona configured
      # with the test's mock IdP as an identity provider. That takes
      # `--setParameter` arguments and a TEST-ONLY CA installed before mongod
      # starts, neither of which `services:` can do, so a script runs the
      # container. It prints the MQLENS_TEST_OIDC_* variables the test reads;
      # when they are unset the test skips.
      # The embedded-shell integration tests run a real mongosh. The version and
      # checksum are the app's own pin for linux-x64 (src-tauri/src/toolsetup.rs).
      - name: Install the pinned mongosh
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mongosh.tgz" https://github.com/mongodb-js/mongosh/releases/download/v2.9.2/mongosh-2.9.2-linux-x64.tgz
          echo "b0febe385c10c9be755c29095ffa95a42bed16ea6625ea3fbde36ae33b42da79  $RUNNER_TEMP/mongosh.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mongosh.tgz" -C "$RUNNER_TEMP"
          echo "MQLENS_TEST_MONGOSH=$RUNNER_TEMP/mongosh-2.9.2-linux-x64/bin/mongosh" >> "$GITHUB_ENV"
      - name: Start the MONGODB-OIDC Percona fixture
        run: bash scripts/oidc-percona-fixture.sh start >> "$GITHUB_ENV"
      - name: Backend tests with coverage
        # Fail the build if line coverage drops below 70% (the agreed target floor).
        # The generated MQLens Server client (src/server/pb) is excluded: it is
        # produced by buf, not written here, and most of it is client methods a
        # given build never calls.
        run: cargo llvm-cov --manifest-path src-tauri/Cargo.toml --summary-only --fail-under-lines 70 --ignore-filename-regex 'src-tauri/src/((lib|main)\.rs|server/pb/)'
      - name: Stop the MONGODB-OIDC Percona fixture
        if: always()
        run: bash scripts/oidc-percona-fixture.sh stop
