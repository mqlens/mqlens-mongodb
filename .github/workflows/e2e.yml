name: E2E

# End-to-end UI tests (#396). A production build of the React app runs in
# Chromium and WebKit, with Tauri's IPC answered by the fake backend in
# e2e/harness. Chromium also measures coverage, and the run fails if it drops
# below the gate in e2e/coverage-setup/options.ts.
#
# The suite is split into shards that run in parallel: one run of it takes
# about 80 minutes of test time. Each Chromium shard keeps its coverage raw;
# the `e2e` job merges every shard's reports, measures the whole suite's
# coverage and applies the gate.
on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shard:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # WebKit takes about half as long again as Chromium, so it gets a shard more.
        include:
          - { project: chromium, shard: 1/2 }
          - { project: chromium, shard: 2/2 }
          - { project: webkit, shard: 1/3 }
          - { project: webkit, shard: 2/3 }
          - { project: webkit, shard: 3/3 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # WebKit needs system libraries on Linux; --with-deps installs them.
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.project }}
      - name: End-to-end tests
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        env:
          E2E_SHARD: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: blob-report-${{ strategy.job-index }}
          path: blob-report
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.project == 'chromium'
        with:
          name: coverage-raw-${{ strategy.job-index }}
          path: coverage/e2e/raw
          retention-days: 3
      # Traces and screenshots of failed tests, to open with `npx playwright show-trace`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results-${{ strategy.job-index }}
          path: test-results
          retention-days: 7

  e2e:
    name: e2e
    needs: shard
    # Runs when a shard fails too, so its report is still merged and published.
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge the shards' test reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-raw-*
          path: coverage-shards
      - name: Merge coverage and apply the gate
        run: npm run test:e2e:merge-coverage -- coverage-shards
      - name: E2E coverage summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'coverage/e2e/coverage-summary.json';
          if (!fs.existsSync(file)) process.exit(0);
          const total = JSON.parse(fs.readFileSync(file, 'utf8')).total;
          const rows = ['lines', 'statements', 'functions', 'branches']
            .map((key) => `| ${key} | ${total[key].pct}% | ${total[key].covered}/${total[key].total} |`)
            .join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## E2E coverage\n\n| Metric | Coverage | Covered |\n|---|---:|---:|\n${rows}\n`);
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-report
          path: |
            playwright-report
            coverage/e2e
      - name: Fail if a shard failed
        if: needs.shard.result != 'success'
        run: |
          echo "A test shard did not pass (result: ${{ needs.shard.result }}). See the merged report."
          exit 1
