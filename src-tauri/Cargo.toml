[package]
name = "tauri-app"
version = "0.20.1"
description = "MQLens — a native desktop GUI for MongoDB."
authors = ["Devesh Kumar <vrshu112@gmail.com>"]
license = "Apache-2.0"
homepage = "https://mqlens.com"
repository = "https://github.com/mqlens/mqlens-mongodb"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
tauri-plugin-biometry = "0.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
mongodb = { version = "3.0.0", features = ["aws-auth", "gssapi-auth"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
russh = "0.63.1"
sysinfo = "0.38.4"
# TLS roots: `rustls-tls` is Mozilla's bundled set (webpki-roots), and
# `rustls-tls-native-roots` adds the OS certificate store, so an identity
# provider behind an internal CA, or reached through a TLS-inspecting proxy,
# is trusted exactly when the browser trusts it (#430). reqwest 0.12.28 loads
# both sets into one root store when a client is built; verification is never
# relaxed. Both features apply to every reqwest client in this crate.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
# Decodes URI option values the way the MongoDB driver does, so the MCP guard
# sees `authMechanism` exactly as the driver would (#430). Already locked
# transitively (via mongodb and url), so this adds no crate.
percent-encoding = "2"
argon2 = "0.6"
aes-gcm = "0.11"
rand = "0.10"
# Kept on the same rand major as `rand` above: determinism requires driving
# fake's generators with OUR seeded StdRng via `Fake::fake_with_rng`, which only
# type-checks when fake's rand and ours are the same major. fake 5.x is the line
# built on rand 0.10 (3.x was rand 0.8, 4.x rand 0.9), so the two move together.
fake = "5"
base64 = "0.23"
rust_xlsxwriter = "0.99.0"
tempfile = "3.27.0"
sha2 = "0.11.0"
zip = "8.6.0"
tar = "0.4.46"
flate2 = "1.1.9"
rmcp = { version = "=2.2.0", features = ["server", "transport-streamable-http-server"] }
# Serves rmcp's `StreamableHttpService` (a plain `tower_service::Service`) on our
# already-bound `TcpListener`. Minimal, no-default-features build: "http1" (we only
# need HTTP/1.1 for a loopback MCP endpoint, no h2) + "tokio" (required to enable
# `axum::serve`/graceful shutdown at all — see axum's own feature table). This is
# the exact feature set rmcp's own test suite uses to drive its streamable-HTTP
# server transport (rmcp-2.2.0/Cargo.toml `[dev-dependencies.axum]`), so it's a
# proven-compatible pairing rather than a guess.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
# Bundled SQLite for local audit log (#272) — no system libsqlite required.
rusqlite = { version = "0.40", features = ["bundled"] }
# Cross-process advisory lock on the audit log so two MQLens instances cannot
# interleave appends and break its hash chain.
fs4 = "0.13"

[dev-dependencies]
tiny_http = "0.12.0"
# Matches capability window patterns in tests the way Tauri's ACL does.
glob = "0.3"
# RS256 signing for the mock OIDC provider in tests only (#430). Never a
# runtime dependency: production never mints tokens, it only receives them.
jsonwebtoken = "9"
# Derives the JWKS `n`/`e` fields from the mock IdP's test-only RSA key
# (#430). Pinned to the exact version already locked transitively (via
# mongodb's aws-auth) so this addition cannot change resolution elsewhere.
rsa = "=0.10.0-rc.18"
# TLS in front of the mock IdP for the real Percona handshake test (#430):
# mongod refuses a plain-HTTP issuer. Both are already locked transitively
# (via reqwest/mongodb), with ring as the provider, so this adds no crates.
# Not tiny_http's own `ssl-rustls` feature: that pins rustls ^0.20 and ring
# 0.16, both carrying unpatched RUSTSEC advisories (2024-0336, 2025-0009).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false }

