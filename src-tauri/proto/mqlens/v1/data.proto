syntax = "proto3";
package mqlens.v1;
option go_package = "github.com/mqlens/mqlens-server/gen/mqlens/v1;mqlensv1";

service DataService {
  rpc Find(FindRequest) returns (stream FindBatch);
  rpc Count(CountRequest) returns (CountResponse);
  rpc Aggregate(AggregateRequest) returns (stream FindBatch);
  rpc Explain(ExplainRequest) returns (ExplainResponse);
}

message AggregateRequest {
  string connection_id = 1;
  string database = 2;
  string collection = 3;
  string pipeline_json = 4; // Extended JSON array of stages
  // Return documents as raw BSON in FindBatch.documents_bson instead of
  // Extended JSON. API version 2.
  bool raw_bson = 5;
}

message ExplainRequest {
  string connection_id = 1;
  string database = 2;
  string collection = 3;
  string kind = 4;        // "find" | "aggregate"
  string query_json = 5;  // filter (find) or pipeline array (aggregate)
  // "queryPlanner" (the default when empty), "executionStats" or
  // "allPlansExecution". API version 2.
  string verbosity = 6;
}
message ExplainResponse {
  string plan_json = 1; // canonical Extended JSON
}

message FindRequest {
  string connection_id = 1;
  string database = 2;
  string collection = 3;
  string filter_json = 4;     // Extended JSON
  string sort_json = 5;
  string projection_json = 6;
  int64 skip = 7;
  int64 limit = 8;
  // Return documents as raw BSON in FindBatch.documents_bson instead of
  // Extended JSON. API version 2.
  bool raw_bson = 9;
}
// Exactly one of the two fields is filled, as the request's raw_bson chose.
message FindBatch {
  repeated string documents_ejson = 1; // canonical Extended JSON
  // Each document's BSON bytes exactly as stored. Extended JSON cannot carry
  // every document: a sub-document such as {"$numberLong": "7"} reads back as
  // the number it resembles.
  repeated bytes documents_bson = 2;
}

message CountRequest {
  string connection_id = 1;
  string database = 2;
  string collection = 3;
  string filter_json = 4;
  // With no filter, estimate from collection metadata (estimatedDocumentCount)
  // instead of counting every document. API version 2.
  bool estimate_if_unfiltered = 5;
}
message CountResponse {
  int64 count = 1;
}
