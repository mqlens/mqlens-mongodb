syntax = "proto3";
package mqlens.v1;
option go_package = "github.com/mqlens/mqlens-server/gen/mqlens/v1;mqlensv1";

service SchemaService {
  rpc AnalyzeSchema(AnalyzeSchemaRequest) returns (AnalyzeSchemaResponse);
}

message AnalyzeSchemaRequest {
  string connection_id = 1;
  string database = 2;
  string collection = 3;
  int64 sample_size = 4;
}
message AnalyzeSchemaResponse {
  int64 sampled = 1;
  repeated FieldSchema fields = 2;
}
message TypeCount {
  string type = 1;
  int64 count = 2;
}
message FieldSchema {
  string path = 1;
  repeated TypeCount types = 2; // per-type occurrence counts
  int64 presence = 3;           // documents containing this path
  double coverage = 4;          // presence / sampled
}
