syntax = "proto3";
package mqlens.v1;
option go_package = "github.com/mqlens/mqlens-server/gen/mqlens/v1;mqlensv1";

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Refresh(RefreshRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  // Signing in through an identity provider. Both are public and answer any API
  // version, as Login does: see docs/desktop-clients.md for the flow.
  rpc ListOidcProviders(ListOidcProvidersRequest) returns (ListOidcProvidersResponse);
  rpc StartOidcLogin(StartOidcLoginRequest) returns (StartOidcLoginResponse);
}

message LoginRequest {
  string tenant = 1; // tenant slug
  oneof login {
    OidcCode oidc = 2;
    LocalCreds local = 3;
  }
}
message OidcCode {
  string code = 1;
  string redirect_uri = 2;
  string code_verifier = 3;
  string state = 4; // from StartOidcLogin
}
message LocalCreds {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1; // JWT
  string refresh_token = 2;
  int64 expires_at = 3; // unix seconds
  Principal principal = 4;
}
message RefreshRequest {
  string refresh_token = 1;
}
message LogoutRequest {
  string refresh_token = 1;
}
message LogoutResponse {}
message WhoAmIRequest {}
message WhoAmIResponse {
  Principal principal = 1;
}

message OidcProvider {
  string id = 1;
  string name = 2;
}
message ListOidcProvidersRequest {
  string tenant = 1; // tenant slug
}
// An unknown tenant lists nothing, like a tenant with no providers.
message ListOidcProvidersResponse {
  repeated OidcProvider providers = 1;
}
message StartOidcLoginRequest {
  string tenant = 1; // tenant slug
  string provider_id = 2;
  // Where the IdP sends the browser back: an http or https URL registered at the
  // IdP. A desktop client uses its loopback listener here.
  string redirect_uri = 3;
  // PKCE: base64url of the SHA-256 of a verifier the client keeps.
  string code_challenge = 4;
}
message StartOidcLoginResponse {
  string authorization_url = 1; // open this in a browser
  // Must come back from the IdP unchanged, and goes into OidcCode. Good for ten
  // minutes, once.
  string state = 2;
}

message Principal {
  string tenant = 1;
  string user_id = 2;
  string email = 3;
  repeated string roles = 4;
}
